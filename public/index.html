<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management</title>
  <style>
    /* Basic styling */

    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }

    button:hover { background-color: #0056b3; }

   /* Общий стиль */
   * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      font-family: Arial, sans-serif;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #f8f9fa;
    }


  
    /* Общие стили */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }

    /* Навигационное меню */
    .navbar {
      background-color: #2b1d8b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
    }

    .navbar .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    .nav-links li {
      display: inline;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-size: 18px;
      transition: color 0.3s ease-in-out;
    }

    .nav-links a:hover {
      color: #00d1ff;
    }

    /* Кнопки */
    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 8px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 20px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-signin {
      border: 2px solid white;
      color: white;
      background: transparent;
    }

    .btn-signin:hover {
      background: white;
      color: #2b1d8b;
    }

    .btn-signup {
      background: #00d1ff;
      color: white;
      border: none;
    }

    .btn-signup:hover {
      background: #00a3cc;
    }

    /* Контейнер */
    .container {
      flex: 1;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    h1 {
        margin-top: 3%;
        margin-bottom: 3%;
      text-align: center;
      color: #343a40;
    }

    /* Таблица */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    tr:hover {
      background-color: #d1ecf1;
    }

    /* Футер */
    .footer {
      background-color: #343a40;
      color: white;
      text-align: center;
      padding: 30px;
      margin-top: auto;
    }
  </style>
  <script>
    const baseUrl = "http://localhost:3000/employees";

    // ✅ Безопасное получение заголовков с токеном
    function getAuthHeaders() {
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Отсутствует токен. Выполните вход заново.");
            window.location.href = "login.html";
            return {};
        }
        return {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        };
    }

    // 📌 Получение списка сотрудников
    async function fetchEmployees() {
        const search = document.getElementById("search").value;
        try {
            const headers = getAuthHeaders();
            if (!headers.Authorization) return;

            const response = await fetch(`${baseUrl}?search=${search}`, { headers });
            if (!response.ok) throw new Error("Не удалось получить данные");
            const employees = await response.json();

            const tableBody = document.getElementById("employee-table-body");
            tableBody.innerHTML = employees.map(emp => `
                <tr>
                    <td>${emp.name}</td>
                    <td>${emp.surname}</td>
                    <td>${emp.email}</td>
                    <td>${emp.status}</td>
                    <td>${emp.department}</td>
                    <td>
                        <button onclick="editEmployee('${emp._id}')">✏️ Edit</button>
                        <button onclick="deleteEmployee('${emp._id}')">🗑️ Delete</button>
                    </td>
                </tr>
            `).join("");
        } catch (err) {
            console.error("Ошибка загрузки сотрудников:", err);
            alert(`Ошибка: ${err.message}`);
        }
    }

    // 📌 Добавление сотрудника
    async function addEmployee() {
        const name = document.getElementById("name").value.trim();
        const surname = document.getElementById("surname").value.trim();
        const email = document.getElementById("email").value.trim();
        const status = document.getElementById("status").value.trim();
        const department = document.getElementById("department").value.trim();

        if (!name || !surname || !email || !status || !department) {
            alert("Все поля должны быть заполнены!");
            return;
        }

        try {
            const headers = getAuthHeaders();
            if (!headers.Authorization) return;

            const response = await fetch(baseUrl, {
                method: "POST",
                headers,
                body: JSON.stringify({ name, surname, email, status, department })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message);
            }

            alert("✅ Сотрудник добавлен!");
            fetchEmployees();
        } catch (err) {
            console.error("Ошибка добавления сотрудника:", err);
            alert(`🚨 Ошибка: ${err.message}`);
        }
    }

    // 📌 Обновление сотрудника
async function editEmployee(id) {
    const name = prompt("Введите новое имя:");
    const surname = prompt("Введите новую фамилию:");
    const email = prompt("Введите новый email:");
    const status = prompt("Введите новый статус (Admin/User):");
    const department = prompt("Введите новый отдел:");

    if (!name || !surname || !email || !status || !department) {
        alert("Все поля должны быть заполнены!");
        return;
    }

    if (id.length !== 24) {
        alert("Неверный формат ID!");
        return;
    }

    try {
        const headers = getAuthHeaders();
        const response = await fetch(`${baseUrl}/${id}`, {
            method: "PUT",
            headers: {
                ...headers,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, surname, email, status, department })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message);
        }

        alert("✅ Сотрудник обновлен!");
        fetchEmployees();
    } catch (err) {
        console.error("Ошибка обновления сотрудника:", err);
        alert(`🚨 Ошибка: ${err.message}`);
    }
}

// 📌 Удаление сотрудника
async function deleteEmployee(id) {
    if (!confirm("❌ Удалить сотрудника?")) return;

    try {
        const headers = getAuthHeaders();
        const response = await fetch(`${baseUrl}/${id}`, {
            method: "DELETE",
            headers: {
                "Authorization": headers.Authorization // Content-Type не нужен
            }
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message);
        }

        alert("🗑️ Сотрудник удален!");
        fetchEmployees();
    } catch (err) {
        console.error("Ошибка удаления сотрудника:", err);
        alert(`🚨 Ошибка: ${err.message}`);
    }
}


    window.onload = fetchEmployees;
</script>

</head>
<body>
  <!-- Navigation Menu -->
  <nav class="navbar">
    <div class="logo">StaffFlow</div>
    <ul class="nav-links">
      <li><a href="index.html">Employees</a></li>
      <li><a href="#">Get The App</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">F.A.Q.</a></li>
    </ul>
    <div class="nav-buttons">
      <a href="login.html" class="btn btn-signin">Sign In</a>
      <a href="registration.html" class="btn btn-signup">Sign Up</a>
    </div>
  </nav>

  <h1>Employee Management</h1>
  <h2>Add Employee</h2>
  <form onsubmit="event.preventDefault(); addEmployee();">
    <input type="text" id="name" placeholder="Name" required>
    <input type="text" id="surname" placeholder="Surname" required>
    <input type="email" id="email" placeholder="Email" required>
    <select id="status" required>
      <option value="Admin">Admin</option>
      <option value="User">User</option>
    </select>
    <input type="text" id="department" placeholder="Department" required>
    <button type="submit">Add</button>
  </form>

  <h2>Search</h2>
  <input type="text" id="search" placeholder="Search by name" oninput="fetchEmployees()">

  <h2>Employees</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Surname</th>
        <th>Email</th>
        <th>Status</th>
        <th>Department</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="employee-table-body">
      <!-- Rows will be populated dynamically -->
    </tbody>
  </table>

  <!-- Футер -->
  <footer class="footer">
    <p>StaffFlow &copy; 2025 | Address: 123 Main Street, City, Country | Phone: +123 456 7890</p>
  </footer>

</body>
</html>
