<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <script>
    async function registerUser() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const status = document.getElementById("status").value;

      const response = await fetch("http://localhost:3000/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password, status })
      });
      
      const result = await response.json();
      alert(result.message);
      if (response.ok) window.location.href = "login.html";
    }
  </script>

<style>
  /* Basic styling */
  body { font-family: Arial, sans-serif; margin: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background-color: #f4f4f4; }
  input, select, button { margin: 5px 0; padding: 10px; width: 100%; }
  button { background-color: #007bff; color: white; border: none; cursor: pointer; }
  button:hover { background-color: #0056b3; }

  /* Общий стиль */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  html, body {
    font-family: Arial, sans-serif;
    height: 100%;
    display: flex;
    flex-direction: column;
    background-color: #f8f9fa;
  }



  /* Общие стили */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background-color: #f8f9fa;
  }

  /* Навигационное меню */
  .navbar {
    background-color: #2b1d8b;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 50px;
  }

  .navbar .logo {
    color: white;
    font-size: 24px;
    font-weight: bold;
  }

  .nav-links {
    list-style: none;
    display: flex;
    gap: 30px;
  }

  .nav-links li {
    display: inline;
  }

  .nav-links a {
    text-decoration: none;
    color: white;
    font-size: 18px;
    transition: color 0.3s ease-in-out;
  }

  .nav-links a:hover {
    color: #00d1ff;
  }

  /* Кнопки */
  .nav-buttons {
    display: flex;
    gap: 15px;
  }

  .btn {
    padding: 8px 20px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 20px;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .btn-signin {
    border: 2px solid white;
    color: white;
    background: transparent;
  }

  .btn-signin:hover {
    background: white;
    color: #2b1d8b;
  }

  .btn-signup {
    background: #00d1ff;
    color: white;
    border: none;
  }

  .btn-signup:hover {
    background: #00a3cc;
  }

  /* Контейнер */
  .container {
    flex: 1;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    background: white;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    border-radius: 10px;
  }

  h1 {
      margin-top: 2%;
      margin-bottom: 2%;
    text-align: center;
    color: #343a40;
  }


  /* Футер */
  .footer {
    background-color: #343a40;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: auto;
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">StaffFlow</div>
    <ul class="nav-links">
      <li><a href="#">Employees</a></li>
      <li><a href="#">Get The App</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">F.A.Q.</a></li>
    </ul>
    <div class="nav-buttons">
      <a href="login.html" class="btn btn-signin">Sign In</a>
      <a href="registration.html" class="btn btn-signup">Sign Up</a>
    </div>
  </nav>

  <h1>Register</h1>
  <input type="text" id="name" placeholder="Name" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <select id="status">
    <option value="User">User</option>
    <option value="Admin">Admin</option>
  </select>
  <button onclick="registerUser()">Register</button>
  <p>Already have an account? <a href="login.html">Login</a></p>
</body>
</html>
