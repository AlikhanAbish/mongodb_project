<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users Info</title>
  <style>
    /* Общий стиль */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      font-family: Arial, sans-serif;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #f8f9fa;
    }


  
    /* Общие стили */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }

    /* Навигационное меню */
    .navbar {
      background-color: #2b1d8b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
    }

    .navbar .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    .nav-links li {
      display: inline;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-size: 18px;
      transition: color 0.3s ease-in-out;
    }

    .nav-links a:hover {
      color: #00d1ff;
    }

    /* Кнопки */
    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 8px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 20px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-signin {
      border: 2px solid white;
      color: white;
      background: transparent;
    }

    .btn-signin:hover {
      background: white;
      color: #2b1d8b;
    }

    .btn-signup {
      background: #00d1ff;
      color: white;
      border: none;
    }

    .btn-signup:hover {
      background: #00a3cc;
    }

    /* Контейнер */
    .container {
      flex: 1;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    h1 {
        margin-top: 3%;
        margin-bottom: 3%;
      text-align: center;
      color: #343a40;
    }

    /* Таблица */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    tr:hover {
      background-color: #d1ecf1;
    }

    /* Футер */
    .footer {
      background-color: #343a40;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: auto;
    }
  </style>
  <script>
    async function fetchUsers() {
      const response = await fetch("http://localhost:3000/employees");
      const users = await response.json();
      const tableBody = document.getElementById("users-table-body");
      tableBody.innerHTML = users.map(user => `
        <tr>
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td>${user.status}</td>
        </tr>
      `).join("");
    }
    window.onload = fetchUsers;
  </script>
</head>
<body>

  <!-- Навигационное меню -->
  <nav class="navbar">
    <div class="logo">StaffFlow</div>
    <ul class="nav-links">
      <li><a href="users_info.html">Employees</a></li>
      <li><a href="#">Get The App</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">F.A.Q.</a></li>
    </ul>
    <div class="nav-buttons">
      <a href="login.html" class="btn btn-signin">Sign In</a>
      <a href="registration.html" class="btn btn-signup">Sign Up</a>
    </div>
  </nav>

  <div class="container">
    <h1>Users Info</h1>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="users-table-body"></tbody>
    </table>
  </div>

  <!-- Футер -->
  <footer class="footer">
    <p>StaffFlow &copy; 2025 | Address: 123 Main Street, City, Country | Phone: +123 456 7890</p>
  </footer>

</body>
</html>
